server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressao para textos e assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Fallback para single page (navegacao por ancoras)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache longo para assets versionados pelo Vite (hash no nome)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cache para midias estaticas (frames, galeria, logo, video)
    location ~* \.(?:jpg|jpeg|png|webp|svg|mp4|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html nunca deve ser cacheado (garante deploy imediato)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
